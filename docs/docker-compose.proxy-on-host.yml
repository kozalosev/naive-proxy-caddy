services:
  caddy:
    image: ghcr.io/kozalosev/naive-proxy-caddy
    container_name: caddy-naive
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./config.env
    volumes:
      - ./auth_users:/etc/caddy/auth_users.enc
      - ~/.config/sops/age/keys.txt:/config/sops/age/keys.txt:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /run/secrets
      - /run/caddy

volumes:
  caddy_data:
  caddy_config:
